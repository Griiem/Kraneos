
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraneos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d12;
            color: #eeeeF5;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        main {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 12px;
        }

        p {
            color: #9999aa;
            margin-bottom: 30px;
        }

        a {
            color: #a78bfa;
            text-decoration: none;
            margin: 0 12px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <h1>Kraneos</h1>
        <p>A private Discord bot.</p>

        <a href="terms/">Terms of Service</a>
        <a href="privacy/">Privacy Policy</a>
    </main>
</body>
</html>
